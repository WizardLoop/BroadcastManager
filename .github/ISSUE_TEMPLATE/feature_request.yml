name: Feature Request ✨
description: Suggest a magical new feature for BroadcastManager!
title: "[Feature] "
labels: [enhancement, feature]
body:
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: Please describe the new feature you'd like to see.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Usage Example
      description: Show a code example or output illustrating how this feature would work.
 
